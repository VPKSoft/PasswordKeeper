[package]
name = "password_keeper"
version = "0.9.2"
description = "PasswordKeeper"
authors = ["VPKSoft", "Petteri Kautonen"]
license = "MIT"
repository = "https://github.com/VPKSoft/PasswordKeeper"
default-run = "password_keeper"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.4.1", features = [] }
tokio = { version = "1.52.1", features = ["full"] }
directories = "6.0.0"
aes-gcm-siv = { version = "0.11.1" }
anyhow = "1.0.102"
rand = "0.10.1"
rust-argon2 = "3.0.0"
zeroize = "1.8.2"
serde_derive = "1.0.219"
totp-rs = { version = "5.7.1", features = ["otpauth"] }
tauri-plugin-window-state = "=2.4.0"
font-kit = "0.14.3"
arboard = "3.6.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-dialog = "2.3.2"
tauri-plugin-process = "2.3.0"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-os = "2.3.2"
tauri-plugin = "2.1.1"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-shell = "2.3.5"
